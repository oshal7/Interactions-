<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paper Sky</title>
  <!-- Standalone: no external files, no network, no modules. Runs in a tab or inside the macOS app/screen saver. -->
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #232a45; }
    html[data-mood="dusk"] body { background: linear-gradient(180deg, #232a45 0%, #4b4a6b 45%, #b48a8f 80%, #e7b99c 100%); }
    html[data-mood="day"] body { background: linear-gradient(180deg, #a9c3dc 0%, #d5e1ea 55%, #f4ece0 100%); }
    html[data-mood="night"] body { background: linear-gradient(180deg, #03050b 0%, #0a1020 60%, #141a2c 100%); }
    #sky { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    html[data-mode="interactive"] #sky { cursor: none; }

    /* lock-screen style clock (screen saver) */
    #clock {
      position: fixed; left: 0; right: 0; top: 11vh; text-align: center; pointer-events: none;
      font-family: -apple-system, "SF Pro Display", "Helvetica Neue", system-ui, sans-serif;
      color: rgba(255, 248, 242, 0.92); text-shadow: 0 1px 20px rgba(0, 0, 0, 0.15);
    }
    #clock .date { font-size: clamp(16px, 1.7vw, 24px); font-weight: 500; opacity: 0.85; }
    #clock .time { font-size: clamp(72px, 10vw, 150px); font-weight: 600; letter-spacing: -0.03em; line-height: 1; margin-top: 4px; }
    html[data-mood="day"] #clock { color: rgba(25, 32, 42, 0.85); }

    #begin {
      position: fixed; inset: 0; display: grid; place-items: center; border: 0; width: 100%;
      background: rgba(10, 12, 24, 0.25); color: #f4eee6; cursor: pointer; transition: opacity 1s ease;
      font: 500 13px/1.4 -apple-system, system-ui, sans-serif; letter-spacing: 0.14em; text-transform: uppercase;
    }
    #begin.fading { opacity: 0; pointer-events: none; }
    #begin[hidden] { display: none; }
    #begin small { display: block; margin-top: 10px; letter-spacing: 0.06em; text-transform: none; opacity: 0.6; }
  </style>
</head>
<body>
  <canvas id="sky" aria-label="Paper planes drifting in every direction. Move the pointer and they follow."></canvas>
  <div id="clock" hidden><div class="date"></div><div class="time"></div></div>
  <button id="begin" type="button">Touch to begin<small>sound on · Esc to leave in the app</small></button>
  <script src="sky.js"></script>
</body>
</html>
